- name: month_index
  family: temporal
  dtype: float64
  source_columns:
  - month_index
  description: "Panel month. Hazard/anomaly/exception only \u2014 banned from the direct-horizon heads,\
    \ whose labels are censored at the panel edge."
  temporal_offset: 0
  allowed_heads:
  - next_state
  - exception_required
  - hazard
  - anomaly
  leakage_risk: medium
  justification: 'Not leakage in the point-in-time sense (month_index is known at scoring time), but a
    censoring trap for the direct-horizon heads: their label rate collapses to zero in months 34-36, so
    the head would learn a spurious ''late month => no event'' rule and mis-score months 37-42. Permitted
    only where the label is uncensored (1-step hazard, contemporaneous exception, unsupervised anomaly).'
