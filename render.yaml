services:
  - type: web
    name: lpie-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: chmod +x render_build.sh && ./render_build.sh
    startCommand: chmod +x render_start.sh && ./render_start.sh
    healthCheckPath: /livez
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HF_REPO_ID
        sync: false
      - key: LPIE_CORS_ORIGINS
        sync: false  # set to the deployed Vercel URL(s), comma-separated — must carry the LPIE_ prefix, see core/config.py _ENV_PREFIX
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: LPIE_FAIL_STARTUP_ON_MISSING_ARTIFACTS
        value: "false"
      - key: LPIE_SKIP_ANOMALY_MODEL
        value: "true"  # anomaly.joblib (198MB serialized) OOMs the free 512MB plan; unset once on a bigger plan
      - key: LPIE_RENDER_SAMPLE_LOANS
        value: "1500"  # full 10k loans OOMs on query (confirmed: 511MB then crash); raise/remove on a bigger plan
      - key: LPIE_LOG_JSON
        value: "true"
      - key: LPIE_DUCKDB_THREADS
        value: "1"
      - key: LPIE_DUCKDB_MEMORY_LIMIT
        value: "400MB"
    autoDeploy: true
